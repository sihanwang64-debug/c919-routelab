name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: pip install -e ".[dev,app,server]"
      - name: Install OpenAP (needs Python 3.11+, skipped on 3.10)
        if: matrix.python-version != '3.10'
        run: pip install "openap>=2.6"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
