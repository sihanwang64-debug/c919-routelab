[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c919-routelab"
version = "0.1.0"
description = "Learning-grade narrow-body route operations analysis on public data (unofficial study project)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["aviation", "aircraft performance", "payload-range", "air transportation", "C919"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
perf = ["openap>=2.6"]
app = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mkdocs-material>=9.5",
    "httpx>=0.27",
    "openap>=2.6",
]

[project.scripts]
routelab = "routelab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/routelab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
